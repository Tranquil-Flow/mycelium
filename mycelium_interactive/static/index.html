<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mycelium Interactive Swarm</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#0e0b15;color:#f6f3fb;--surface:#171220;--raised:#211a2d;--border:#3a2d4c;--muted:#a99fb8;--lime:#a8ef63;--cyan:#6ed9d1;--danger:#f16f76;--mono:SFMono-Regular,Consolas,Menlo,monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top left,rgba(110,217,209,.14),transparent 34%),#0e0b15}main{width:min(1120px,calc(100vw - 28px));margin:0 auto;padding:34px 0 56px}.hero,.card{border:1px solid var(--border);border-radius:22px;background:rgba(23,18,32,.92);box-shadow:0 18px 42px rgba(4,2,8,.28)}.hero{padding:28px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{padding:20px}.wide{grid-column:1/-1}.eyebrow{margin:0 0 8px;color:var(--cyan);text-transform:uppercase;letter-spacing:.12em;font-size:.76rem}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(2rem,5vw,4.4rem);line-height:.95;margin-bottom:14px}button,input,textarea{font:inherit}button{border:1px solid #5a4b70;border-radius:13px;padding:10px 14px;color:inherit;background:rgba(246,243,251,.06);cursor:pointer}button.primary{color:#07110a;background:linear-gradient(135deg,var(--lime),var(--cyan));font-weight:800}button:disabled{opacity:.55;cursor:not-allowed}input,textarea{width:100%;border:1px solid var(--border);border-radius:13px;background:#09070f;color:#f6f3fb;padding:10px 12px}textarea{min-height:96px;resize:vertical}.stack{display:grid;gap:11px}.facts{display:grid;gap:9px;margin:0}.facts div{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid rgba(58,45,76,.7);padding-bottom:8px}.facts dt{color:var(--muted)}.facts dd{margin:0;text-align:right;font-family:var(--mono);word-break:break-all}.claim{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.claim span{padding:7px 10px;border:1px solid #4b3d61;border-radius:999px;background:rgba(168,239,99,.08);color:#c4f59a;font-family:var(--mono);font-size:.82rem}.invite-list{display:grid;gap:12px}.invite-row{display:grid;gap:8px;padding:13px;border:1px solid var(--border);border-radius:15px;background:rgba(9,7,15,.55)}.invite-title{display:flex;justify-content:space-between;gap:12px;align-items:center}.invite-title span{color:var(--cyan);font-family:var(--mono);font-size:.76rem;text-transform:uppercase;letter-spacing:.08em}.message{color:#c4f59a}.error{color:var(--danger);font-family:var(--mono)}small{color:var(--muted)}code{font-family:var(--mono)}@media(max-width:800px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <script type="module" src="/interactive.js"></script>
</body>
</html>
