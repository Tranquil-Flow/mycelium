name: Governance gates

on:
  pull_request:
  push:

jobs:
  governance:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install governance test dependencies
        run: python -m pip install --requirement tests/governance-requirements.txt
      - name: Verify executable claim governance
        run: python scripts/governance_gate.py --repo-root . --json
      - name: Run governance and contract negative suites
        run: python -m pytest -q tests/governance tests/claims tests/contracts

  # Portable-host probe.  The A13 acceptance tranche is the second platform
  # family in this repository and it is the suite the readiness audit measured
  # at 196 passed / 0 failed / 0 skipped on a POSIX host with pytest +
  # cryptography only, so it is the cheapest honest way to notice that a
  # Linux/macOS-only assumption has entered the shipped install source.
  #
  # PREDICTION, NOT AN OBSERVED RESULT: this job has never been run on
  # windows-latest by the change that added it.  The audit's named worst case is
  # the join path in mycelium_a13_linux/onboarding.py::_atomic_write, which uses
  # os.O_NOFOLLOW (absent on Windows) and fsyncs an os.open()-ed directory
  # (not permitted on Windows).  A red windows job here is information, not a
  # flake: do NOT add continue-on-error, and do not narrow the suite to make it
  # green.
  windows-portability:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install governance test dependencies
        run: python -m pip install --requirement tests/governance-requirements.txt
      - name: Run A13 acceptance suites on a non-POSIX host
        run: python -m pytest -q tests/a13_acceptance
