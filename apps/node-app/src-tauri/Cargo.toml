[package]
name = "mycelium-node-app"
version = "0.1.0"
description = "Mycelium mobile node app shell"
authors = ["Mycelium contributors"]
license = "AGPL-3.0-only"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "mycelium_node_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.0", features = [] }
tauri-plugin-deep-link = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[dependencies.mycelium-mobile-core]
path = "../../../native/mobile_core"
features = ["net"]

[target.'cfg(target_os = "android")'.dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
