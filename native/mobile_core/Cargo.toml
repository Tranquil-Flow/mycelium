# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "mycelium-mobile-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "AGPL-3.0-only"
description = "Shared Rust core of the Mycelium node app (Android, iOS, browser)"
publish = false

[lib]
crate-type = ["rlib"]

[features]
default = []
# Networking: seed HTTP client, embedded iroh endpoint and the node supervisor.
# Everything outside this feature stays wasm32-compatible for the browser page.
net = ["artifact-source", "dep:reqwest"]
# The embedded iroh transport and the A2-over-iroh artifact carrier only (no
# HTTP client): what the native iroh sidecar links to serve phone objects.
artifact-source = ["dep:tokio", "dep:iroh"]
# In-process transport tests need tokio test macros.

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
getrandom = "0.2"
hex = "0.4"
hkdf = "0.12"
# Pure-Rust (musl port) transcendental functions: identical results on the
# phone and on the host, unlike the platform libm behind f32::exp/sin/cos.
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision"] }
sha2 = "0.10"
thiserror = "2"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = "1"
iroh = { version = "=1.0.2", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision"] }

# Free space on the artifact volume (statvfs) for artifact admission.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[[example]]
name = "node_cli"
required-features = ["net"]

[[example]]
name = "route_peer"
required-features = ["net"]

[[example]]
name = "artifact_source"
required-features = ["net"]
