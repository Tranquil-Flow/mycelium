[pytest]
# ---------------------------------------------------------------------------
# Test ladder markers and level selection (PLAN v2 §2.1)
#
# Levels: L0 unit -> L1 focused -> L2 full parallel -> L3 emulation -> L4 physical.
# Every collected item carries exactly one level marker, applied from the
# collected module path by the repository-root `conftest.py` (see its module
# docstring for the mapping and for the rules that make an unclassified path a
# visible failure instead of a silent default).
#
# L2 selection (the full parallel run on a quiet host, run by the orchestrator)
# is the `l2_marker_expression` value below; pass it with `-m`:
#
#   PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. .venv/bin/python -m pytest -q \
#     -p no:cacheprovider -n auto -m "not scaffold_red and not flaky and not emulation and not physical"
#
# `flaky` is assigned only by the quarantine register (tests/QUARANTINE.md)
# after a test has three isolation receipts; tests/QUARANTINE.md is empty today,
# so no item carries it yet.
#
# The default `addopts` filter stays `not scaffold_red` (below) so runs that
# name paths explicitly - lane L0/L1 commands, the readiness gate's emulated
# chain check on tests/testbed/test_emulation*.py - still collect what they name.
# ---------------------------------------------------------------------------
markers =
    unit: in-process test of one module: no child process, no listen socket, no real model artifact (L0)
    integration: drives a real boundary - child process, listening port, iroh sidecar, or a real model artifact on disk (L1/L2)
    emulation: L3 local two-worker emulation on the shipped path: tests/testbed/test_emulation*.py, the soak harness tests, test_two_process_*.py
    physical: L4 hardware suite: any path under a physical_* directory (tests/physical_qualification, tests/physical_runner, tests/physical_preflight)
    flaky: quarantined by tests/QUARANTINE.md after three isolation receipts; excluded from L2, never used to hide a red
    scaffold_red: RED-by-design scaffolding/acceptance suite for a gate that is not implemented yet; deselected from default runs, opt in with -m scaffold_red (docs/operations/red-by-design-suites.md)
addopts = -m "not scaffold_red"
l2_marker_expression = not scaffold_red and not flaky and not emulation and not physical
mycelium_ladder_strict = true
