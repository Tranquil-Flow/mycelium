[pytest]
# ---------------------------------------------------------------------------
# RED-by-design suite collection policy
# Operator note: docs/operations/red-by-design-suites.md
#
# Some lane deliverables ship suites that exercise behaviour the gate has not
# implemented yet. They fail on purpose and are honest evidence of missing
# functionality, but they must not turn an ordinary full-suite run red.
#
# Default collection therefore deselects the `scaffold_red` marker. The suites
# stay runnable as an explicit opt-in (an explicit -m on the command line wins
# over the addopts default below):
#
#   PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. /opt/homebrew/bin/python3.14 \
#     -m pytest -q -p no:cacheprovider -m scaffold_red \
#     tests/a10_scaffold tests/a11_scaffold tests/a12_scaffold \
#     tests/a14b_acceptance tests/a7_acceptance
#
# The marker is applied to each suite by that suite's own conftest.py.
# ---------------------------------------------------------------------------
markers =
    scaffold_red: RED-by-design scaffolding/acceptance suite for a gate that is not implemented yet; deselected from default runs, opt in with -m scaffold_red (docs/operations/red-by-design-suites.md)
addopts = -m "not scaffold_red"
