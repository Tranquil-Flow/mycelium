[package]
name = "model"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
[features]
default = []
# The product's Qwen tokenizer (`tokenizers` 0.22.2, onig) for the QW-2 identity check.
tokenizer = ["dep:tokenizers"]
[dependencies]
stage-contract = { path = "../stage-contract" }
sha2 = "=0.10.9"
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"], optional = true }
[dev-dependencies]
serde_json = "=1.0.154"
[lints]
workspace = true
