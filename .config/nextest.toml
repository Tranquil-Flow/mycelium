# SPDX-License-Identifier: AGPL-3.0-only
# Test profiles for the workspace (process fix P4). Run with `cargo nextest run --profile <name>`.
#   quick   fast loop used by `cargo xtask quick`: fail-fast, short slow-timeout, no slow or two-host/device tests
#   merge   whole workspace, no fail-fast, JUnit at target/nextest/merge/junit.xml
#   nightly merge settings, no retries; ignored tests are added on the command line because nextest has no
#           config key for them: `cargo nextest run --profile nightly --run-ignored all`
# No test is deleted or loosened here: `quick` only selects. Everything it leaves out still runs in `merge`.

# Setup scripts (headless-release below) are a nextest experimental feature; nothing else uses one.
experimental = ["setup-scripts"]

[profile.default]
fail-fast = true

# hello-bootstrap: the six real-process tests of node-service::hello_bootstrap (the whole binary is those six)
# start the real mycelium-hello-bootstrap helper and its ioreg identity probe. When workspace runs overlap,
# running them side by side pushed helper startup past the WorkerStartup budget (six failures in one merge run,
# green on rerun). One at a time they stay inside it; the budget itself is not touched.
# The [test-groups] table is global. The override sits in profile.default, which quick, merge and nightly all
# inherit (nextest checks the selected profile's overrides first, then its inheritance chain, then default),
# so one entry covers all three. It sets only test-group: no timeout, retry or other grouping changes.
[test-groups]
hello-bootstrap = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary_id(=node-service::hello_bootstrap)'
test-group = 'hello-bootstrap'

# headless-release (B11, gap row 23): api::headless_leave_cleanup runs the RELEASE headless launcher. Each of
# its tests used to build it itself (a nested `cargo build --release`): on a cold target the first test paid
# the whole build (57 s on m4/main) against quick's 60 s slow-timeout, and the others waited behind cargo's
# target lock on their own clocks. This script builds it ONCE, before any test of that binary starts, into the
# same target directory as the tests (CARGO_TARGET_DIR or the workspace target), and names it in
# MYCELIUM_HEADLESS_RELEASE; the tests then only read it and check it is exactly the binary they would have
# built. Without nextest (plain `cargo test`) the tests still build it themselves, once per process. No
# timeout is changed. The script runs only when a selected test matches the filter.
[scripts.setup.headless-release]
command = ["bash", "-c", """
set -eu
target="${CARGO_TARGET_DIR:-$NEXTEST_WORKSPACE_ROOT/target}"
"${CARGO:-cargo}" build --offline --locked -p api --release --example headless \
    --manifest-path "$NEXTEST_WORKSPACE_ROOT/Cargo.toml" --target-dir "$target" >&2
echo "MYCELIUM_HEADLESS_RELEASE=$target/release/examples/headless" >> "$NEXTEST_ENV"
"""]

[[profile.default.scripts]]
filter = 'binary_id(=api::headless_leave_cleanup)'
setup = "headless-release"

# api::headless_swarm_publish (B12f) runs the same launcher: each of its tests used to nest a debug build
# of it (about 40 s under quick load), which left its slowest test a few seconds inside the 60 s limit.
[[profile.default.scripts]]
filter = 'binary_id(=api::headless_swarm_publish)'
setup = "headless-release"

# api::headless_product (B13) runs the same launcher.
[[profile.default.scripts]]
filter = 'binary_id(=api::headless_product)'
setup = "headless-release"

# quick skips, and never runs, these (each is still run by merge and nightly):
#  * every #[ignore]d test (nextest skips them unless --run-ignored is given). The real two-host and
#    two-device suites are all #[ignore]d ("explicit isolated native qualification", "requires local assets").
#  * any test named for two hosts, two Macs or real devices, should one ever be added without #[ignore].
#  * the tests that took more than 5 s in the 2026-11-03 merge run (3116 tests, 107 over 5 s, on a loaded host).
#    They are 5384 s of the 6068 s of summed test time; the other 3009 tests sum to 684 s.
#    The list below is generated from target/nextest/merge/junit.xml (testcases with time > 5):
#    after a merge run, re-list them (name = test, binary_id = classname) and update this block.
#  * added 2026-11-11 from the lane SC merge run (budget-model tests over 5 s once the RU-053 pins are valid and
#    the catalogue tests do their full check instead of failing early on a stale pin): the RU-053 admitted
#    closure (289 s), the launch-graph fixpoint (156 s) and its census table (7 s), and the sixteen
#    admission_catalogue_ru053_refuses_* tests (5-75 s each, selected by name prefix so a new one is covered).
#    With several lanes building, nine of them crossed the 60 s limit in every quick run.
# A test that still passes the filter but runs for 60 s (15 s period x 4) is killed and fails the run.
[profile.quick]
fail-fast = true
slow-timeout = { period = "15s", terminate-after = 4 }
